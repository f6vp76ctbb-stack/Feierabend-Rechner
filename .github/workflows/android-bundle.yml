name: Android App Bundle (AAB)

# Baut das Release-App-Bundle für Google Play.
# Das AAB wird UNSIGNIERT gebaut und im Branch `aab-build` abgelegt; signiert wird
# anschließend lokal mit dem Upload-Schlüssel (der nie in dieses öffentliche Repo gehört).
# Echte AdMob-IDs beim manuellen Start eintragen (Actions → Run workflow).
on:
  push:
    branches:
      - claude/feierabend-rechner-app-joa1y4
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-bundle.yml'
  workflow_dispatch:
    inputs:
      admob_app_id:
        description: 'AdMob-App-ID (ca-app-pub-…~…), leer = Test-ID'
        required: false
        default: ''
      admob_banner_android:
        description: 'AdMob-Banner-ID (ca-app-pub-…/…), leer = Test-ID'
        required: false
        default: ''
      admob_rewarded_android:
        description: 'AdMob-Belohnungsvideo-ID (ca-app-pub-…/…), leer = Test-ID'
        required: false
        default: ''

concurrency:
  group: android-bundle
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  bundle:
    name: AAB bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: App Bundle bauen (unsigniert)
        env:
          ADMOB_APP_ID: ${{ inputs.admob_app_id }}
          BANNER: ${{ inputs.admob_banner_android }}
          REWARDED: ${{ inputs.admob_rewarded_android }}
        run: |
          DEFINES=""
          [ -n "$BANNER" ] && DEFINES="$DEFINES --dart-define=ADMOB_BANNER_ANDROID=$BANNER"
          [ -n "$REWARDED" ] && DEFINES="$DEFINES --dart-define=ADMOB_REWARDED_ANDROID=$REWARDED"
          flutter build appbundle --release --build-number=${{ github.run_number }} $DEFINES
          ls -la build/app/outputs/bundle/release/

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: build/app/outputs/bundle/release/app-release.aab

      - name: AAB im Branch aab-build ablegen
        run: |
          mkdir out
          cp build/app/outputs/bundle/release/app-release.aab out/feierabend-unsigned.aab
          cd out
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          echo "${{ github.run_number }}" > VERSION_CODE
          [ -n "${{ inputs.admob_app_id }}" ] && echo "real" > ADS || echo "test" > ADS
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b aab-build
          git add .
          git commit -q -m "Unsigniertes AAB aus ${GITHUB_SHA} (versionCode ${{ github.run_number }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" aab-build
