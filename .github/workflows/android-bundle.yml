name: Android App Bundle (AAB)

# Baut das Release-App-Bundle für Google Play.
# Das AAB wird UNSIGNIERT gebaut und im Branch `aab-build` abgelegt; signiert wird
# anschließend lokal mit dem Upload-Schlüssel (der nie in dieses öffentliche Repo gehört).
# Release-Builds nutzen die echten AdMob-IDs (unten unter env); beim manuellen Start
# lassen sie sich überschreiben. Lokale/Debug-Builds behalten Googles Test-IDs.
on:
  push:
    branches:
      - claude/feierabend-rechner-app-joa1y4
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-bundle.yml'
  workflow_dispatch:
    inputs:
      admob_app_id:
        description: 'AdMob-App-ID (ca-app-pub-…~…), leer = Release-ID'
        required: false
        default: ''
      admob_banner_android:
        description: 'AdMob-Banner-ID (ca-app-pub-…/…), leer = Release-ID'
        required: false
        default: ''
      admob_rewarded_android:
        description: 'AdMob-Belohnungsvideo-ID (ca-app-pub-…/…), leer = Release-ID'
        required: false
        default: ''

concurrency:
  group: android-bundle
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"
  # Echte AdMob-IDs (Thinkube, App „Feierabend Rechner“) – nicht geheim, stehen ohnehin in der App.
  RELEASE_ADMOB_APP_ID: "ca-app-pub-8596176219181991~3672450377"
  RELEASE_ADMOB_BANNER_ANDROID: "ca-app-pub-8596176219181991/4877720835"
  RELEASE_ADMOB_REWARDED_ANDROID: "ca-app-pub-8596176219181991/6079121863"
  # Firebase / Google Analytics 4 – Werte aus google-services.json (nicht geheim).
  # Leer = Nutzungsstatistik ist im Build komplett aus.
  FIREBASE_API_KEY: ""
  FIREBASE_APP_ID: ""
  FIREBASE_SENDER_ID: ""
  FIREBASE_PROJECT_ID: ""

jobs:
  bundle:
    name: AAB bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Tests
        run: flutter test

      # Zwei Bundles pro Lauf, jeder versionCode ist bei Google Play nur einmal erlaubt:
      #   Store  (Produktion):          versionCode = 2 × run_number
      #   Tester (geschlossener Test):  versionCode = 2 × run_number + 1, TESTER_BUILD=true
      #                                 (Pro + alle Designs frei, keine Werbung) – NIE in Produktion!
      - name: App Bundles bauen (unsigniert)
        env:
          ADMOB_APP_ID: ${{ inputs.admob_app_id || env.RELEASE_ADMOB_APP_ID }}
          BANNER: ${{ inputs.admob_banner_android || env.RELEASE_ADMOB_BANNER_ANDROID }}
          REWARDED: ${{ inputs.admob_rewarded_android || env.RELEASE_ADMOB_REWARDED_ANDROID }}
        run: |
          DEFINES=""
          [ -n "$BANNER" ] && DEFINES="$DEFINES --dart-define=ADMOB_BANNER_ANDROID=$BANNER"
          [ -n "$REWARDED" ] && DEFINES="$DEFINES --dart-define=ADMOB_REWARDED_ANDROID=$REWARDED"
          if [ -n "$FIREBASE_APP_ID" ]; then
            DEFINES="$DEFINES --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID"
            DEFINES="$DEFINES --dart-define=FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          fi
          # Nur ARM (≈ alle Handys; Intel-Chromebooks übersetzen ARM). Ohne x86_64 bleibt das
          # signierte AAB unter 30 MiB (Grenze für die Übergabe aus der Claude-Sitzung).
          DEFINES="$DEFINES --target-platform android-arm,android-arm64"
          VC=$(( ${{ github.run_number }} * 2 ))
          mkdir out
          flutter build appbundle --release --build-number=$VC $DEFINES
          cp build/app/outputs/bundle/release/app-release.aab out/feierabend-unsigned.aab
          echo "$VC" > out/VERSION_CODE
          flutter build appbundle --release --build-number=$((VC + 1)) $DEFINES --dart-define=TESTER_BUILD=true
          cp build/app/outputs/bundle/release/app-release.aab out/feierabend-tester-unsigned.aab
          echo "$((VC + 1))" > out/VERSION_CODE_TESTER
          ls -la out/

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: out/*.aab

      - name: AABs im Branch aab-build ablegen
        run: |
          cd out
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          echo "real" > ADS
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b aab-build
          git add .
          git commit -q -m "Unsignierte AABs aus ${GITHUB_SHA} (Store $(cat VERSION_CODE), Tester $(cat VERSION_CODE_TESTER))"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" aab-build
