name: Start-Test (Emulator)

# Baut das Release-APK wie für den Store (R8, echte AdMob-IDs), signiert mit einem
# Wegwerf-Schlüssel und startet es auf mehreren Android-Versionen im Emulator.
# Logcat + Screenshots landen im Job-Log und je API im Branch `launch-test-api<N>`.
on:
  push:
    branches:
      - claude/feierabend-rechner-app-joa1y4
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/ci/**'
      - '.github/workflows/launch-test.yml'
  workflow_dispatch:

concurrency:
  group: launch-test
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  build:
    name: Release-APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Wegwerf-Schlüssel (nur für diesen Test)
        run: |
          keytool -genkeypair -keystore android/app/launch-test.jks -storepass testtest -keypass testtest \
            -alias test -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=Launch Test"
          printf 'storePassword=testtest\nkeyPassword=testtest\nkeyAlias=test\nstoreFile=app/launch-test.jks\n' > android/key.properties

      - name: Release-APKs (R8, echte AdMob-IDs) – Store-Version + Tester-Version
        env:
          ADMOB_APP_ID: "ca-app-pub-8596176219181991~3672450377"
        run: |
          ADS="--dart-define=ADMOB_BANNER_ANDROID=ca-app-pub-8596176219181991/4877720835 --dart-define=ADMOB_REWARDED_ANDROID=ca-app-pub-8596176219181991/6079121863"
          flutter build apk --release $ADS
          cp build/app/outputs/flutter-apk/app-release.apk app-free.apk
          flutter build apk --release $ADS --dart-define=TESTER_BUILD=true
          cp build/app/outputs/flutter-apk/app-release.apk app-tester.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app-free.apk
            app-tester.apk

  emulator:
    name: Start auf API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    # Ein hängender Emulator darf nicht stundenlang laufen (normal: ~10–15 Min.).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            target: google_apis
          - api: 30
            target: google_apis_playstore
          - api: 35
            target: google_apis_playstore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator starten und App testen
        timeout-minutes: 35 # danach läuft der Ergebnis-Schritt trotzdem
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/ci/launch_test.sh ${{ matrix.api }} app-free.apk app-tester.apk

      - name: Ergebnisse in Branch launch-test-api${{ matrix.api }} ablegen
        if: always()
        run: |
          mkdir -p launch-results
          cd launch-results
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b launch-test-api${{ matrix.api }}
          git add .
          git commit -q -m "Start-Test API ${{ matrix.api }} aus ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" launch-test-api${{ matrix.api }}
